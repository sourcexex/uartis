[package]
name = "uartis"
version = "1.2.1"
description = "Uartis - cross-platform serial debugging tool"
authors = ["Sourcex"]
license = "Apache-2.0"
repository = "https://github.com/sourcexex/uartis"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
serialport = "4.4"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
encoding_rs = "0.8"
dirs = "5.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
sha2 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
