name: Release

# Tag push is the only trigger. The gate job then requires:
#   1. the tagged commit is on `main` (the production branch)
#   2. version.json changed vs the previous version tag
#   3. the tag is Vx.y.z / vx.y.z and matches version.json
# Only when the gate sets should_build=true do the build jobs run.
on:
  push:
    tags:
      - 'V*.*.*'
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Evaluate release conditions
        id: check
        run: bash scripts/ci-release-gate.sh

  build:
    name: Build ${{ matrix.name }}
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: --bundles nsis
            rust_targets: x86_64-pc-windows-msvc
            sums: windows
          - name: macOS
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            rust_targets: aarch64-apple-darwin
            sums: macos
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 75
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Build the real frontend before Rust tests: the tauri::generate_context!
      # macro needs frontendDist to exist, and this also validates the bundle.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Shipping an untested tag is what the gate exists to prevent.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Configure Apple signing (optional)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then
            echo "::warning title=macOS signing skipped::APPLE_CERTIFICATE is not configured; building an ad-hoc signed, non-notarized DMG."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/uartis-cert.p12"
          if ! printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$CERT_PATH" 2>/dev/null; then
            echo "::warning title=macOS signing skipped::APPLE_CERTIFICATE is not valid base64; building an ad-hoc signed, non-notarized DMG."
            exit 0
          fi
          if ! openssl pkcs12 -in "$CERT_PATH" -noout -passin pass:"${APPLE_CERTIFICATE_PASSWORD:-}" 2>/dev/null; then
            echo "::warning title=macOS signing skipped::APPLE_CERTIFICATE is not a valid PKCS#12 bundle or the password does not match; building an ad-hoc signed, non-notarized DMG. Re-export the Developer ID Application certificate as .p12 and base64-encode it to enable signing."
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "${APPLE_API_KEY_P8:-}" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY; do
            echo "${var}=${!var}" >> "$GITHUB_ENV"
          done
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "Apple signing material configured"

      - name: Build and attach to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: Uartis ${{ needs.gate.outputs.version }}
          releaseBody: |
            ${{ github.ref_name }}

            - Windows: `.exe` (NSIS installer, unsigned)
            - macOS (Apple Silicon): `.dmg` (signed and notarized when Apple credentials are configured; otherwise ad-hoc signed)

            SHA256 checksums are attached as `SHA256SUMS.txt`.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Each platform hashes its own installer; the checksums job merges the
      # per-platform files into the single SHA256SUMS.txt attached to the release.
      - name: Generate SHA256SUMS (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $Bundle = "src-tauri/target/release/bundle/nsis"
          $Files = Get-ChildItem -Path $Bundle -Filter *.exe -File
          if (-not $Files) { throw "No NSIS installer found in $Bundle" }
          $Lines = foreach ($File in $Files) {
            $Hash = (Get-FileHash $File.FullName -Algorithm SHA256).Hash.ToLower()
            "$Hash  $($File.Name)"
          }
          $Path = "SHA256SUMS-${{ matrix.sums }}.txt"
          [System.IO.File]::WriteAllText($Path, (($Lines -join "`n") + "`n"), [System.Text.Encoding]::ASCII)
          Get-Content $Path

      - name: Generate SHA256SUMS (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          Bundle="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          ls "$Bundle"/*.dmg >/dev/null
          (cd "$Bundle" && shasum -a 256 *.dmg) > "SHA256SUMS-${{ matrix.sums }}.txt"
          cat "SHA256SUMS-${{ matrix.sums }}.txt"

      - name: Upload checksum file
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "SHA256SUMS-${{ matrix.sums }}.txt" --clobber

  checksums:
    name: Merge SHA256SUMS
    needs: [gate, build]
    if: needs.gate.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Merge per-platform checksum files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p sums
          gh release download "$TAG" --repo "$REPO" --pattern 'SHA256SUMS-*.txt' --dir sums --clobber
          cat sums/SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$REPO" --clobber
          for f in sums/SHA256SUMS-*.txt; do
            gh release delete-asset "$TAG" "$(basename "$f")" --repo "$REPO"
          done

  release-notes:
    name: Fill release notes
    needs: [gate, build, checksums]
    if: needs.gate.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate notes from commits since the previous tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOTES="$(gh api "repos/${REPO}/releases/generate-notes" -f tag_name="${TAG}" --jq .body)"
          BODY="$(printf '%s\n\n%s\n\n---\n\nSHA256 checksums: see SHA256SUMS.txt on this release.\n' "${TAG}" "${NOTES}")"
          gh release edit "${TAG}" --repo "${REPO}" --notes "${BODY}"
