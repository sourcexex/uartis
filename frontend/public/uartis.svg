<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="uartisTitle">
  <title id="uartisTitle">Uartis</title>
  <defs>
    <linearGradient id="tileBg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E293D"/>
      <stop offset="1" stop-color="#080C14"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="307" cy="246" r="635" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#0A84FF" stop-opacity="0.045"/>
      <stop offset="0.8" stop-color="#0A84FF" stop-opacity="0.007"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="799" cy="901" r="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.07"/>
      <stop offset="0.6" stop-color="#22D3EE" stop-opacity="0.011"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="uFill" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DBE8FC"/>
    </linearGradient>
    <linearGradient id="traceFill" x1="0" y1="0" x2="1024" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FE3FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <filter id="traceGlow" x="-30%" y="-60%" width="160%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="tileClip">
      <rect width="1024" height="1024" rx="224"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect width="1024" height="1024" fill="url(#tileBg)"/>
    <rect width="1024" height="1024" fill="url(#glowBlue)"/>
    <rect width="1024" height="1024" fill="url(#glowCyan)"/>
    <rect x="4" y="4" width="1016" height="1016" rx="220" fill="none" stroke="#FFFFFF" stroke-opacity="0.094" stroke-width="2"/>
  </g>

  <!-- bold rounded U -->
  <path d="M272 296 V508 A240 240 0 0 0 752 508 V296" fill="none" stroke="url(#uFill)"
        stroke-width="116" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- UART signal pulse with a soft accent glow -->
  <path d="M366 574 H444 V470 H580 V574 H658" fill="none" stroke="#0A84FF" stroke-width="48"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.42" filter="url(#traceGlow)"/>
  <path d="M366 574 H444 V470 H580 V574 H658" fill="none" stroke="url(#traceFill)" stroke-width="48"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
